name: Android Client Build
on:
  workflow_dispatch:
  push:
    tags: ['client-v*']
  pull_request:
    paths:
      - '.github/workflows/android-build.yml'
      - 'artifacts/mobile/**'
      - 'artifacts/desktop/ui/**'
      - 'artifacts/web-client-core/**'
      - 'artifacts/product-platform/registry/snapshots/**'
      - 'artifacts/product-platform/registry/package-locators/**'
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.98.0-x86_64-unknown-linux-gnu
      RUSTUP_AUTO_INSTALL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.9+10.0.LTS'
      - name: Install pinned Android SDK and Rust targets
        shell: bash
        run: |
          test -n "$ANDROID_HOME"
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          "$sdk_manager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.0 --profile minimal --target aarch64-linux-android
          rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown
      - name: Fetch locked native dependencies (setup only)
        shell: bash
        env:
          CARGO_NET_OFFLINE: 'false'
        run: |
          npm ci --prefix artifacts/mobile --ignore-scripts --no-audit --no-fund
          npm ci --prefix artifacts/mobile/ci-browser-deps --ignore-scripts --no-audit --no-fund
          # Tauri's release feature/host metadata graph also resolves locked
          # desktop crates (for example atk), even for an Android artifact.
          # Prime the complete lockfile before the strictly offline build.
          cargo fetch --locked --manifest-path artifacts/mobile/src-tauri/Cargo.toml
          rustup run 1.93.0-x86_64-unknown-linux-gnu cargo fetch --locked --manifest-path artifacts/web-client-core/Cargo.toml --target wasm32-unknown-unknown
      - name: Generate the shared GUI and verified public app assets
        env:
          VIBAPP_ROOMHASH_WEB_ROOT: ${{ github.workspace }}/artifacts/mobile/ci-browser-deps
        run: node artifacts/web-client-core/sync-web-gui.mjs
      - name: Mobile host boundary tests
        run: npm test --prefix artifacts/mobile
      - name: Build native ARM64 APK (unsigned)
        run: node artifacts/mobile/build-android.mjs
      - name: Show bounded Android build diagnostics on failure
        if: failure()
        shell: bash
        run: |
          if test -f artifacts/mobile/output/android-build.log; then
            tail -c 12000 artifacts/mobile/output/android-build.log
          fi
      - name: Collect bounded unsigned build evidence
        run: node artifacts/mobile/collect-ci-artifact.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-android-arm64-unsigned
          path: generated/client-release-android/*
          if-no-files-found: error
          retention-days: 14

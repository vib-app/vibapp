name: Client Release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional new preview tag, e.g. client-v0.1.0-preview.1; blank only builds'
        required: false
        default: ''
      platforms:
        description: 'JSON platform list; subset builds are diagnostic only'
        required: false
        default: '["darwin-arm64","darwin-x64","linux-x64","win32-x64"]'
  push:
    tags: ['client-v*']
  pull_request:
    paths: ['.github/workflows/client-release.yml', 'artifacts/desktop/ci/**', 'artifacts/desktop/scripts/**']
permissions:
  contents: read
concurrency:
  group: client-release-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms || '["darwin-arm64","darwin-x64","linux-x64","win32-x64"]') }}
    runs-on: ${{ fromJSON('{"darwin-arm64":"macos-15","darwin-x64":"macos-15-intel","linux-x64":"ubuntu-22.04","win32-x64":"windows-2022"}')[matrix.platform] }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: roomhash/headless
          ref: 03345ed558c1f3e38a5cdf0ab95a20467aa1d333
          path: generated/release-deps/RoomHash/headless
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Linux native GUI prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev patchelf xvfb
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: rust-cache
        if: github.event_name != 'pull_request'
        with:
          path: |
            ~/.cargo/registry
            artifacts/runtime-daemon/target-service-1_98
            artifacts/desktop/target
          key: ${{ matrix.platform }}-product-v2-${{ hashFiles('artifacts/desktop/ci/release-dependencies.json', 'artifacts/desktop/src-tauri/Cargo.lock', 'artifacts/runtime-daemon/service-runtime/Cargo.lock') }}
      - name: Shared UI regression tests
        run: node --test artifacts/desktop/ui/tests/app-ui.test.mjs artifacts/desktop/scripts/tests/desktop-build-inputs.test.mjs artifacts/desktop/ci/release-policy.test.mjs artifacts/desktop/ci/windows-installer.test.mjs
      - name: Compile, package and verify client
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node artifacts/desktop/ci/build-release.mjs
      - name: Retain compiler cache after diagnostic failures
        if: always() && github.event_name != 'pull_request' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            artifacts/runtime-daemon/target-service-1_98
            artifacts/desktop/target
          key: ${{ matrix.platform }}-product-v2-${{ hashFiles('artifacts/desktop/ci/release-dependencies.json', 'artifacts/desktop/src-tauri/Cargo.lock', 'artifacts/runtime-daemon/service-runtime/Cargo.lock') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-${{ matrix.platform }}
          path: generated/client-release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/client-v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: client-*
          merge-multiple: true
          path: release
      - name: Verify transferred artifacts
        working-directory: release
        run: |
          for sums in SHA256SUMS-*; do sha256sum --check "$sums"; done
          node ../artifacts/desktop/ci/verify-release-set.mjs .
      - name: Stage draft preview after desktop checks (mobile signing is separate)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node --input-type=module -e 'import {releaseTag} from "./artifacts/desktop/ci/release-policy.mjs";releaseTag(process.env.RELEASE_TAG)'
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$RELEASE_TAG" release/* --verify-tag --draft --prerelease --title "VibApp $RELEASE_TAG" --notes-file docs/product/client-release-notes.md
          else
            set +e
            git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"
            lookup_status=$?
            set -e
            if [ "$lookup_status" -ne 2 ]; then
              echo "Tag lookup must confirm a new tag; refusing an existing tag or lookup failure" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --draft --prerelease --title "VibApp $RELEASE_TAG" --notes-file docs/product/client-release-notes.md
          fi

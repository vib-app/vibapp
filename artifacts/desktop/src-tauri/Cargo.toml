[package]
name = "vibapp-desktop"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "vibapp-launcher"

[workspace]

[[bin]]
name = "vibapp-launcher"
path = "src/main.rs"

[[bin]]
name = "vibapp-runtime"
path = "src/bin/vibapp-runtime.rs"

[[bin]]
name = "vibapp-product-bridge"
path = "src/bin/vibapp-product-bridge.rs"

[build-dependencies]
sha2 = "=0.10.9"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["custom-protocol"] }
uuid = { version = "=1.25.0", features = ["v4"] }
wasmtime = { version = "=36.0.13", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }

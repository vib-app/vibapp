[package]
name = "vibapp-mobile"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "vibapp_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["custom-protocol"] }

[profile.release]
strip = true
opt-level = "s"
lto = "thin"
codegen-units = 1
